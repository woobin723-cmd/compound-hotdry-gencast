# Spatio-Temporal Transformer · SPI-1(30일) 단일 일별 윈도우 (복합 앙상블용)
# 🔄 2026-06-03: SPI-1 전환. CNN-LSTM spi1과 동일 윈도우(30일 일별)로 앙상블 정합.
#   손실(Focal)·변수·분할 확정 유지. 멀티스케일 폐기(사유는 cnn_lstm_spi1.yaml 참조).
model:
  name: transformer
  in_vars: 4
  patch_size: 8             # 8×8 패치 토큰화 (~135 토큰)
  embed_dim: 256
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.2              # 과적합 방지(14일서 과적합 관측 → 강화 유지)
  attention: factorized     # 공간/시간 분리 어텐션 (30스텝 메모리 절약)
  pos_encoding: 2d_latlon

data:
  time_window: 30           # 30일 일별 단일 윈도우 (멀티스케일 미사용)
  # build_model이 time_embed 길이를 seq_len(cfg)=30으로 자동 설정

loss:
  name: focal               # 확정 손실(변경 금지)
  alpha: 0.25
  gamma: 2.0

train:
  batch_size: 4             # factorized 어텐션 → 30스텝도 batch 4 가능(ms 25스텝서 4 정상)
  epochs: 80                # 조기종료로 과적합 전 자동 중단
  lr: 5.0e-4
  weight_decay: 5.0e-2
  warmup_epochs: 5
  grad_clip: 1.0
  sampler:
    oversample: true
    pos_boost: 4.0
  early_stopping:
    patience: 12
  seed: 42

smoke:
  epochs: 30
  batch_size: 4
  subset_days: 90
