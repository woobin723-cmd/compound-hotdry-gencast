# Spatio-Temporal Transformer 멀티스케일 (복합 한정, 앙상블 비교용)
# 최근 14일 일별 + 이전 77일 주별평균(11스텝) = 25스텝으로 90일 커버.
# CNN-LSTM ms와 동일 윈도우 → 앙상블 정합. 손실(Focal)·변수·분할 확정 유지.
model:
  name: transformer
  in_vars: 4
  patch_size: 8             # 8×8 패치 토큰화 (~134 토큰)
  embed_dim: 256
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.2              # 과적합 방지(14일서 ep15후 과적합 관측 → 강화 유지)
  attention: factorized     # 공간/시간 분리 어텐션 (메모리 절약, 25스텝에 특히 중요)
  pos_encoding: 2d_latlon

data:
  time_window: 14           # 멀티스케일 미사용 시 폴백값(아래 multiscale 우선)
  multiscale:
    enabled: true
    short_days: 14          # 최근 N일 일별(고해상·단기신호)
    long_steps: 11          # 장기 블록 수
    long_block: 7           # 블록당 일수(주별=7) → 장기 77일 커버
    # lookback = 14 + 11*7 = 91일,  모델 시퀀스 = 11 + 14 = 25스텝
    # build_model이 time_embed 길이를 seq_len(cfg)=25로 자동 설정

loss:
  name: focal               # 확정 손실(변경 금지)
  alpha: 0.25
  gamma: 2.0

train:
  batch_size: 4             # 25스텝(14일의 ~1.8배 메모리) → 8→4(OOM 회피)
  epochs: 80                # 조기종료로 과적합 전 자동 중단
  lr: 5.0e-4
  weight_decay: 5.0e-2
  warmup_epochs: 5
  grad_clip: 1.0
  sampler:
    oversample: true
    pos_boost: 4.0
  early_stopping:
    patience: 12
  seed: 42

smoke:
  epochs: 30
  batch_size: 4
  subset_days: 120          # 멀티스케일 lookback 91일 > 60일이라 smoke subset 확대
