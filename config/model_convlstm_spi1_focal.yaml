# ConvLSTM · SPI-1(30일) · 앙상블 멤버 확장 · Focal Loss 통일
# 🔬 2026-06-08: 앙상블 멤버 다양성 확장(목표 4멤버). CNN-LSTM의 "공간 평탄화" 약점을
#   ConvLSTM(게이트 conv·hidden state 공간 보존)으로 보완. 손실은 A안대로 Focal 통일.
#   윈도우 30일·변수 4·분할·오버샘플 전부 동일, 모델 구조만 교체. 출력 *_spi1_focal.pt.
model:
  name: convlstm
  in_vars: 4                # t2m, tp, Z500, t850
  hidden_channels: [64, 64] # 2층(얕게) — 작은 데이터 과적합 억제
  kernel_size: 3
  dropout: 0.2

data:
  time_window: 30           # 30일 일별 단일 윈도우
  # 입력 텐서: (batch, time=30, vars=4, lat=71, lon=120)

train:
  batch_size: 2
  epochs: 30
  lr: 1.0e-3
  weight_decay: 5.0e-4
  warmup_epochs: 3
  grad_clip: 1.0
  pos_weight: null          # focal에선 미사용(alpha가 불균형 처리)
  sampler:
    oversample: true
    pos_boost: 4.0
  early_stopping:
    patience: 7
  seed: 42

loss:
  name: focal               # 앙상블 멤버 손실 통일
  alpha: 0.25
  gamma: 2.0

smoke:
  epochs: 30
  batch_size: 2
  subset_days: 90
